            data: [...layer.data]
        })),

        // 現在選択中のレイヤー
        currentLayerIndex: currentLayerIndex,

        // 選択範囲
        selectedPixels: Array.from(selectedPixels),

        // パレット情報
        palette: [...palette],

        // 現在選択中のパレット色
        currentPaletteIndex: currentPaletteIndex
    };

    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const link = document.createElement('a');
    link.download = 'pixel-art.pxd';
    link.href = URL.createObjectURL(blob);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    // オブジェクトURLを解放
    URL.revokeObjectURL(link.href);
}

// 独自形式読み込み
function loadCustomFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pxd';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = JSON.parse(event.target.result);
                if (data.version && data.width && data.height && data.layers) {
                    pixelWidth = data.width;
                    pixelHeight = data.height;
                    layers = data.layers;
                    currentLayerIndex = data.currentLayerIndex || 0;
                    selectedPixels = new Set(data.selectedPixels || []);
                    // パレットを復元
                    if (Array.isArray(data.palette) && data.palette.length > 0) {
                        palette = data.palette;

                        currentPaletteIndex = data.currentPaletteIndex ?? 0;

                        if (
                            currentPaletteIndex < 0 ||
                            currentPaletteIndex >= palette.length
                        ) {
                            currentPaletteIndex = 0;
                        }

                        currentColor = palette[currentPaletteIndex];
                    }
                    undoStack = [];
                    redoStack = [];

                    setupCanvas();
                    setupPalette();
                    updateLayerUI();
                    updateCurrentColor();
                    saveCanvasToStorage();
                } else {
                    alert('無効なファイル形式です');
                }
            } catch (e) {
                alert('ファイルの読み込みに失敗しました');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// 移動ツールの処理
function handleMoveTool(clientX, clientY, isEnd = false) {
    if (currentTool !== 'move') return;

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((clientX - rect.left) / zoom);
    const y = Math.floor((clientY - rect.top) / zoom);

    if (!isMoving) {
        isMoving = true;
        moveStartX = x;
        moveStartY = y;
        return;
    }

    const deltaX = x - moveStartX;
    const deltaY = y - moveStartY;

    if (deltaX === 0 && deltaY === 0) return;

    const layer = layers[currentLayerIndex];

    if (selectedPixels.size > 0) {
        // 選択範囲の移動
        const newSelectedPixels = new Set();
        const movedData = {};

        selectedPixels.forEach(key => {
            const [sx, sy] = key.split(',').map(Number);
            const newX = sx + deltaX;
            const newY = sy + deltaY;

            if (newX >= 0 && newX < pixelWidth && newY >= 0 && newY < pixelHeight) {
                const oldIndex = sy * pixelWidth + sx;
                const newIndex = newY * pixelWidth + newX;
                movedData[newIndex] = layer.data[oldIndex];
                newSelectedPixels.add(`${newX},${newY}`);
            }
        });

        // 移動元をクリア
        selectedPixels.forEach(key => {
            const [sx, sy] = key.split(',').map(Number);
            const oldIndex = sy * pixelWidth + sx;
            layer.data[oldIndex] = null;
        });

        // 移動先に設定
        Object.entries(movedData).forEach(([index, color]) => {
            layer.data[parseInt(index)] = color;
        });

        selectedPixels = newSelectedPixels;
    } else {
        // Layer全体の移動
        const newData = new Array(pixelWidth * pixelHeight).fill(null);

        for (let y = 0; y < pixelHeight; y++) {
            for (let x = 0; x < pixelWidth; x++) {
                const oldIndex = y * pixelWidth + x;
                const newX = x + deltaX;
                const newY = y + deltaY;

                if (newX >= 0 && newX < pixelWidth && newY >= 0 && newY < pixelHeight) {
                    const newIndex = newY * pixelWidth + newX;
                    newData[newIndex] = layer.data[oldIndex];
                }
            }
        }

        layer.data = newData;
    }

    moveStartX = x;
    moveStartY = y;
    renderCanvas();
    saveCanvasToStorage();

    if (isEnd) {
        isMoving = false;
    }
}

// Layerポップアップの切り替え
function toggleLayerPopup() {
    const popup = document.getElementById('layerPopup');
    const toggle = document.getElementById('layerPopupToggle');
    popup.classList.toggle('collapsed');
    toggle.textContent = popup.classList.contains('collapsed') ? '◀Layer' : '▶Layer';
    toggle.style.writingMode = popup.classList.contains('collapsed') ? "vertical-lr" : "horizontal-tb";
}

function showToast(message) {
  const toast = document.getElementById("toast");
  
  // メッセージを動的に設定
  toast.innerText = message;
  
  // showクラスを追加して表示
  toast.classList.add("show");
  
  // 3秒後に自動的に閉じる
  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

// 初期化実行
init();

// Layerポップアップの初期状態を設定
document.getElementById('layerPopupToggle').textContent = '▶Layer';
